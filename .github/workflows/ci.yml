name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pi-plugin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: packages/pi-plugin
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: packages/pi-plugin
        run: pnpm run typecheck

      # The helper's own tests cover the sandbox itself: Landlock rules, the
      # namespace setup and the capability drop.
      - name: Helper tests
        run: cargo test --manifest-path packages/helper/Cargo.toml --locked

      # Builds the helper first (the package's pretest hook), then runs the
      # scope and context suites against a fake pi API.
      - name: Extension tests
        working-directory: packages/pi-plugin
        run: pnpm test

      # The end-to-end suite needs a real model and is run by hand:
      #   PI_E2E_MODEL=<provider>/<model> pnpm run test:e2e

      # The worktree hook has no dependencies, and these cases start it the way
      # pi-subagents does: the file itself, with nothing but a shebang.
      - name: Worktree hook tests
        run: node packages/worktree-setup/test/hook.test.mjs
