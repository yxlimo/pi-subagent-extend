name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Three legs, because the helper behaves differently on each shape a host
    # can present, and the default runner only shows one of them. The ABI and
    # namespace numbers below were measured on these images:
    #
    #   ubuntu-latest (7.x)  ABI 8, user namespaces refused by AppArmor
    #   ubuntu-24.04  (6.x)  ABI 8, user namespaces refused by AppArmor
    #   ubuntu-22.04  (5.15) ABI 4, user namespaces allowed
    #
    #   namespaces   modern kernel, restriction lifted -> the real sandbox
    #   fallback     modern kernel, restriction in place -> Landlock alone
    #   abi-below-7  5.15 kernel -> the sandbox refuses to run at all
    #
    # The fallback leg is the one that broke silently before, and the ABI leg
    # was only ever simulated with a stub helper, so both are here for real.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: namespaces
            lift: "yes"
            expect: network isolated
            expect_exit: 0
          - os: ubuntu-latest
            mode: fallback
            lift: "no"
            expect: cannot enter the namespaces
            expect_exit: 0
          - os: ubuntu-22.04
            mode: abi-below-7
            lift: "no"
            expect: ABI 7 is required
            expect_exit: 76
    runs-on: ${{ matrix.os }}
    name: check (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, and a persisted token would sit in .git/config
          # where the sandboxed commands these tests run can read it.
          persist-credentials: false

      # Ubuntu's default (apparmor_restrict_unprivileged_userns=1) lets
      # unshare(CLONE_NEWUSER) succeed, then refuses setgroups, mount, netns
      # and pidns. Measured: default -> setgroups EPERM and
      # unshare(NEWNS|NEWNET|NEWPID) EPERM; after this -> all four succeed.
      # The other legs deliberately leave the default alone.
      - name: Allow unprivileged user namespaces
        if: matrix.lift == 'yes'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pi-plugin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: packages/pi-plugin
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: packages/pi-plugin
        run: pnpm run typecheck

      # The helper's own tests cover the sandbox itself: Landlock rules, the
      # namespace setup and the capability drop.
      - name: Helper tests
        run: |
          cargo test --manifest-path packages/helper/Cargo.toml --locked

      # Say out loud which shape this leg got. Each leg asserts the shape it is
      # supposed to see, so a run that quietly took the wrong path fails here
      # instead of passing.
      - name: Sandbox self-check
        env:
          EXPECT: ${{ matrix.expect }}
          EXPECT_EXIT: ${{ matrix.expect_exit }}
        run: |
          cargo build --release \
            --manifest-path packages/helper/Cargo.toml --locked
          spec=$(mktemp)
          printf '%s' '{"read":["/"],"write":["/tmp"],' >"$spec"
          printf '%s' '"offline":true,"env":{}}' >>"$spec"
          helper=packages/helper/target/release/pi-subagent-extend-helper
          # Capture the status instead of letting `set -e` abort the step: the
          # helper's own message is the thing worth printing.
          set +e
          out=$("$helper" --spec "$spec" -- true 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne "$EXPECT_EXIT" ]; then
            echo "::error::expected exit $EXPECT_EXIT, got $code"
            exit 1
          fi
          case "$out" in
            *"$EXPECT"*) ;;
            *)
              echo "::error::expected '$EXPECT' on this leg"
              exit 1
              ;;
          esac

      # Builds the helper first (the package's pretest hook), then runs three
      # suites: the scope and context ones against a fake pi API, and the mock
      # session one against a real pi process driven by a scripted
      # OpenAI-compatible mock server (no model, no network beyond localhost).
      - name: Extension tests
        working-directory: packages/pi-plugin
        run: pnpm test

      # Real-model checks stay manual: they are for final debugging only, and
      # any boundary they reveal should come back as a mock-session case.
      #   PI_E2E_MODEL=<provider>/<model> pnpm run test:llm

      # The worktree hook has no dependencies, and these cases start it the way
      # pi-subagents does: the file itself, with nothing but a shebang.
      - name: Worktree hook tests
        run: node packages/worktree-setup/test/hook.test.mjs
