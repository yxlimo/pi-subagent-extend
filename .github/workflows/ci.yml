name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ubuntu's default (apparmor_restrict_unprivileged_userns=1) lets
      # unshare(CLONE_NEWUSER) succeed, then refuses setgroups, mount, netns
      # and pidns. The sandbox would silently fall back to Landlock only and
      # the namespace code would never be exercised here. Measured on this
      # image:
      #   default   setgroups EPERM, unshare(NEWNS|NEWNET|NEWPID) EPERM
      #   sysctl 0  all four succeed
      # It is a throwaway VM, and without this the tests below would not cover
      # the isolation they exist to check.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pi-plugin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: packages/pi-plugin
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: packages/pi-plugin
        run: pnpm run typecheck

      # The helper's own tests cover the sandbox itself: Landlock rules, the
      # namespace setup and the capability drop.
      - name: Helper tests
        run: |
          cargo test --manifest-path packages/helper/Cargo.toml --locked

      # Say out loud whether the sandbox really got its namespaces. The helper
      # reports entering the network namespace and shadowing the resolver
      # sockets on stderr, and this step fails when that line is missing: a
      # quiet fallback to Landlock-only otherwise looks exactly like success.
      - name: Sandbox self-check
        run: |
          cargo build --release \
            --manifest-path packages/helper/Cargo.toml --locked
          spec=$(mktemp)
          printf '%s' '{"read":["/"],"write":["/tmp"],' >"$spec"
          printf '%s' '"offline":true,"env":{}}' >>"$spec"
          helper=packages/helper/target/release/pi-subagent-extend-helper
          # Capture the status instead of letting `set -e` abort the step: the
          # helper's own message is the thing worth printing.
          set +e
          out=$("$helper" --spec "$spec" -- true 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::the helper exited $code"
            exit 1
          fi
          case "$out" in
            *"network isolated"*) ;;
            *)
              echo "::error::no network namespace was entered"
              exit 1
              ;;
          esac

      # Builds the helper first (the package's pretest hook), then runs three
      # suites: the scope and context ones against a fake pi API, and the mock
      # session one against a real pi process driven by a scripted
      # OpenAI-compatible mock server (no model, no network beyond localhost).
      - name: Extension tests
        working-directory: packages/pi-plugin
        run: pnpm test

      # Real-model checks stay manual: they are for final debugging only, and
      # any boundary they reveal should come back as a mock-session case.
      #   PI_E2E_MODEL=<provider>/<model> pnpm run test:llm

      # The worktree hook has no dependencies, and these cases start it the way
      # pi-subagents does: the file itself, with nothing but a shebang.
      - name: Worktree hook tests
        run: node packages/worktree-setup/test/hook.test.mjs
