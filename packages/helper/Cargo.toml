[package]
name = "pi-subagent-extend-helper"
version = "0.1.0"
edition = "2021"
description = "Sandbox a command for pi-subagent-extend: Landlock for files, a network namespace for the network"
license = "MIT"

[[bin]]
name = "pi-subagent-extend-helper"
path = "src/main.rs"

[dependencies]
landlock = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
panic = "abort"
