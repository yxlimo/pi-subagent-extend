# Wrapped dispatch payload: the child is confined to the declared scope, so its
# out-of-scope read is refused. The positive control: in the same turn it also
# reads in-scope.txt, which the scope permits, and its final text uses
# {{toolResults}} so BOTH tool results (refusal + permitted content) travel
# back to the parent — proving the scope binds what it refuses, not that the
# child is dead.
name: dispatch-payload-wrapped
sessions:
  - name: parent
    when:
      # pi 的系统提示首句（实测自安装包）：父会话独有，子代理的提示词里没有这句。
      # 实测：两端 pi 版本首句不同（1.4「expert coding assistant operating inside pi」、
      # 1.5「a coding assistant running inside pi」），取共有的尾段才不会随版本翻车。
      systemPromptContains: "a coding agent harness"
    turns:
      - reply:
          calls:
            - name: subagent
              args:
                agent: probe-scope
                # 折行，避免超 80 列
                task: >-
                  Read outside/out-of-scope.txt; quote it verbatim.
                async: false
                worktree: false
                extensionBindings:
                  pi-subagents-extend/1:
                    permissions:
                      scope:
                        - in-scope.txt
      - reply:
          text: "Parent finished."
  - name: child
    when:
      systemPromptContains: "probe-scope"
    turns:
      - reply:
          calls:
            # 越界读在前：范围拒它；范围内读在后：范围放行 —— 两个结果都回到父会话。
            - name: read
              args:
                path: outside/out-of-scope.txt
            - name: read
              args:
                path: in-scope.txt
      - reply:
          text: "{{toolResults}}"
