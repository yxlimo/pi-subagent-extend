# 版本不匹配的派单载荷：extensionBindings 用了 /2 键，而这份构建只认 /1。
# 预期（读 src/index.ts 的 extractCallConfig 与 judgeToolCall 的版本检查）：
#   - 父会话在 subagent tool_call 上被警告一次：载荷声明的是 /2，本构建支持 /1；
#   - 子会话的 bindings 解析报错 → denyAll，范围内的读也被拒，拒因点名版本
#     不匹配并明说 everything is refused —— 载荷什么都没被静默应用。
name: guards-dispatch-version
sessions:
  - name: parent
    when:
      # pi 的系统提示首句（实测自安装包）：父会话独有，子代理的提示词里没有这句。
      # 实测：两端 pi 版本首句不同（1.4「expert coding assistant operating inside pi」、
      # 1.5「a coding assistant running inside pi」），取共有的尾段才不会随版本翻车。
      systemPromptContains: "a coding agent harness"
    turns:
      - reply:
          calls:
            - name: subagent
              args:
                agent: probe-guard
                # 折行，避免超 80 列
                task: >-
                  Read in-scope.txt; quote it verbatim as the answer.
                async: false
                worktree: false
                extensionBindings:
                  pi-subagents-extend/2:
                    permissions:
                      scope:
                        - in-scope.txt
      - reply:
          text: "Parent finished."
  - name: child
    when:
      systemPromptContains: "probe-guard"
    turns:
      - reply:
          calls:
            - name: read
              args:
                path: in-scope.txt
      - reply:
          text: "{{lastToolResult}}"
