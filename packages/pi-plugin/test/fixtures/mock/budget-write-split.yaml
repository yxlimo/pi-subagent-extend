# 写预算与 deny 预算分开计数：writeScope 只授 src/report.md，写 src/a.ts 是
# 「读得到、写不到」→ 写预算（maxWriteDenies: 1：第 1 次警告、第 2 次硬停）；
# 中间夹一次越界读 → deny 预算（maxDenies: 3，只用了 1，不带任何预算措辞）。
# 判据：停机文案点名 write budget，且全程没有出现 denial budget——
# 两个计数器互不挪用，读拒也没有重置写计数（只有放行的调用才清零）。
name: budget-write-split
sessions:
  - name: main
    when: {}
    turns:
      # 第 1 轮：写范围外的写（src/a.ts 可读不可写）→ 写预算警告。
      - reply:
          calls:
            - name: write
              args:
                path: src/a.ts
                content: "nope\n"
      # 第 2 轮：越界读 → deny 预算计数（1/3，平拒）。
      - reply:
          calls:
            - name: read
              args:
                path: outside.md
      # 第 3 轮：再写同一个范围外路径 → 写预算硬停。
      - reply:
          calls:
            - name: write
              args:
                path: src/a.ts
                content: "nope\n"
